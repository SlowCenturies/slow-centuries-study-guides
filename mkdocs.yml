site_name: Slow Centuries Study Guides
site_description: Free, classroom-ready study guides for the Slow Centuries YouTube series, with primary sources from museums and archives.
site_url: https://GITHUB_USER.github.io/slow-centuries-study-guides/
repo_url: https://github.com/GITHUB_USER/slow-centuries-study-guides
repo_name: slow-centuries-study-guides
edit_uri: edit/main/docs/
copyright: Text CC BY 4.0 · Slow Centuries
theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/brightness-4, name: Light mode}
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/brightness-7, name: Dark mode}
  font: false
  features: [navigation.sections, navigation.top, content.action.edit, toc.follow, search.highlight]
  icon: {logo: material/timer-sand}
extra_css: [stylesheets/brand.css]
markdown_extensions:
  - attr_list
  - def_list
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Home: index.md
  - Episodes:
      - Timelapse of Algorithms: algorithms/index.md
      - Timelapse of Money: money/index.md
      - Timelapse of Encryption: encryption/index.md
  - For teachers: teachers.md
